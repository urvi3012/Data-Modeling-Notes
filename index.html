<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Data Modeling Notes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<h1>📊 Data Modeling for Data Engineers</h1>

<!-- ================= MEDALLION ================= -->
<section>
  <h2>Medallion Architecture</h2>

  <div class="flow">
    <div class="box" onclick="showLayer('bronze')">🟢 Bronze</div>
    <div class="arrow">→</div>
    <div class="box" onclick="showLayer('silver')">⚪ Silver</div>
    <div class="arrow">→</div>
    <div class="box" onclick="showLayer('gold')">🟡 Gold</div>
  </div>

  <div id="layer-info" class="info-box"></div>
</section>

<!-- ================= SCD ================= -->
<section>
  <h2>Slowly Changing Dimensions</h2>

  <button onclick="showSCD(1)">SCD Type 1</button>
  <button onclick="showSCD(2)">SCD Type 2</button>

  <div id="scd-info" class="info-box"></div>
</section>

<!-- ================= STAR VS SNOWFLAKE ================= -->
<section>
  <h2>Star vs Snowflake Schema</h2>

  <button onclick="toggleSchema('star')">Star Schema</button>
  <button onclick="toggleSchema('snowflake')">Snowflake Schema</button>

  <div id="schema-info" class="info-box"></div>
</section>

<!-- ================= FACT VS DIM ================= -->
<section>
  <h2>Fact vs Dimension Tables</h2>

  <table>
    <tr>
      <th>Type</th>
      <th>Description</th>
      <th>Example</th>
    </tr>
    <tr>
      <td>Fact</td>
      <td>Stores numerical metrics</td>
      <td>Revenue, Quantity</td>
    </tr>
    <tr>
      <td>Dimension</td>
      <td>Provides context</td>
      <td>Customer, Product</td>
    </tr>
  </table>
</section>

<script src="script.js"></script>
</body>
</html>
